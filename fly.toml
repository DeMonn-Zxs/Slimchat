# fly.toml app configuration file generated for slimchat on 2026-10-11T07:14:10Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'slimchat'
primary_region = 'ams'

[build]

[env]
  DB_PATH = '/data/slimchat.db'
  PORT = '8080'
  UPLOADS_DIR = '/data/uploads'

[[mounts]]
  source = 'slimchat_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 4096
